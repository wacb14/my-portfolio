<div class="container">
  <span class="element" (click)="change()" [class.active]="english.active"
    ><img src="../../../assets/flags/us.svg" alt="" class="flag"></span
  >
  <span class="element" (click)="change()" [class.active]="spanish.active"
    ><img src="../../../assets/flags/spain.svg" alt="" class="flag"></span
  >
  <span
    class="selector"
    [ngClass]="english.active == false ? 'selector-right' : ''"
  ></span>
</div>
